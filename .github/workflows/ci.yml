name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate sample data and confirm it matches the committed files
        run: |
          make sample
          git diff --stat --exit-code data/sample || (echo "data/sample is stale: run make sample and commit" && exit 1)
      - name: Tests, data quality checks and grounding evals
        run: make check
      - name: Brief (offline template, grounding check must pass)
        run: PYTHONPATH=src python -m oda.insights --offline
      - uses: actions/upload-artifact@v4
        with:
          name: sample-marts-and-brief
          path: |
            data/marts_sample/
            reports/
